repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mpfc-leakage-check
        name: mPFC windowed leakage check
        entry: python projects/mPFC_spikes/leakage_check.py
        language: system
        pass_filenames: false
        files: ^(edgar/scoring/|projects/mPFC_spikes/)
