run:
  random_seed: 42

io:
  data_path: ""     # synthetic; unused

evolution:
  n_generations: 2
  n_islands: 2
  batch_size: 2
  critical_population_size: 6
  n_migrants: 1
  topology: [1, 0]

llms:
  num_parents: 2
  # Headless Claude Code: no API key needed, uses the local `claude` binary
  # via edgar/llm/claude_headless.py.
  model_llm: claude-code-headless
  param_est_llm: claude-code-headless
  jax_model_translator_llm: claude-code-headless
  max_tokens: 10000

scoring:
  # State-space seeds carry more params (log_sigma_obs + one s0_* per state key)
  # than windowed models; drop the penalty so it doesn't dominate the loss.
  param_penalty_weight: 0.001
  # Long lax.scan sequences take longer to JIT-compile + optimize.
  timeout_s: 300.0
  gradient_descent:
    max_iter: 500
    # Backprop through T=1024 scan is a deep graph; smaller lr + gradient clip
    # keeps training stable.
    learning_rate: 0.005
    gradient_clip_norm: 5.0

project_params:
  n_trajectories: 32
  T: 1024
  dt: 0.05
  freq_mean: 1.0
  freq_drift_amp: 0.3      # slow-sinusoid frequency drift amplitude
  freq_drift_period: 400   # samples per full drift cycle
  damping: 0.05
  process_noise_std: 0.15
  obs_noise_std: 0.05
  T_eval: 100              # short trajectories for fingerprint discrimination
  n_eval: 4
  seed: 42
