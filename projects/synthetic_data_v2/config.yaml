# Synthetic autoregressive benchmark. Data is generated by the loader from
# random_seed; data_path must stay empty so launch-gcp skips the data upload.
io:
  data_path: ""

evolution:
  n_generations: 12
  n_islands: 8
  batch_size: 6
  critical_population_size: 12
  n_migrants: 2
  topology: [1, 2, 3, 4, 5, 6, 7, 0]

scoring:
  # Parameters are counted elementwise, so the penalty has to sit well below the loss
  # scale or it selects on parameter count rather than on the science. Losses here run
  # from 2.5e-5 (the true 3-parameter equation, at the noise floor) to 4e-1 (an affine
  # AR(1)). At 1e-6 the truth pays 3e-6 and a 10-parameter polynomial pays 1e-5 —
  # negligible against its 3e-3 loss — so the penalty only breaks near-ties.
  param_penalty_weight: 1.0e-6

project_params:
  n_cells: 32
  n_times: 500
  burn_in: 200
  process_noise: 0.005
  obs_noise: 0.0
  block_len: 100
  random_seed: 0
  n_eval_samples: 4
