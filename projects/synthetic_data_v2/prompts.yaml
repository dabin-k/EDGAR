# Overrides for the autoregressive setting. String fields replace the default
# entirely (projects/prompt_defaults.yaml).
model:
  base: |
    You are an AI scientist studying the spontaneous activity of single particles. Your aim is to find a single parametric model that describes the time evolution of the activity of each particle.

    Below are {num_parents} models predicting how one particle's activity evolves in time, sorted from worst to best. Your task is to create a new model, better than all of them.

    **How the model is used, and how the loss is computed.** Let x(t) be the activity of one particle at time t. The model sees the last 20 values and predicts the next one:

        w = [x(t-19), ..., x(t-1), x(t)]    pred = model(w)    # prediction of x(t+1)

        loss = mean over all t of ( pred - x(t+1) )^2

    *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

  explore: |
    Be *creative* and *invent* something new. Which features in the models below correlate with lower loss? Interpret these features more broadly and creatively, and experiment with novel ways to implement these features.

  code_guidelines: |
    **Code Generation Guidelines:**

    * Import any packages you use.
    * Model signature must be `def model(data, params):`.
    * `data['x']` is the window for a single particle: a **one-dimensional** array of shape (20,). `data['x'][-1]` is the most recent step, `data['x'][-2]` the one before it. This is the only information you get: no stimulus, no sight of the other particles, and no sight of the step you are predicting.
    * Return the particle's predicted activity at the next step: a **scalar**, not an array.
    * `params` is a dict of named scalars (e.g. params['decay_rate']). All free parameters must be numeric.
    * Free parameters are penalized elementwise, and they are fitted per particle. A model with a handful of parameters that captures the shape of the law will beat a model with twenty that merely interpolates it.
    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument.
    * Ensure all string values in function call arguments are properly JSON-escaped.
    * Also provide `default_params`: sensible initial float values for every key in `params`, with exactly matching keys.
  image_analysis_instructions: |
    **Image Analysis Instructions:**

    The attached figure has one row per particle, for four particles drawn from the population. The particles change from generation to generation.

    *Left.* The particle's true activity in black, over one block of the recording, with each model's one-step-ahead prediction overlaid in colour. The shaded region at the start is the first few timepoints, which have no window behind them and so are never predicted.

    *Right.* Each model's residual (prediction minus data) for the same particle, in matching colours. A perfect model leaves this flat at zero.

    Diagnose from the residuals, not the traces: two models can track the data equally well by eye and still differ tenfold in loss. Consider:

    **Structure.** Does the residual look like noise, or does it vary systematically? Systematic residual is the signature of a missing term, and its shape is evidence about what that term is.

    Use this to design a new model that removes the systematic errors you can see.

parameter_estimator:
  base: |
    You are an AI scientist studying the spontaneous activity of single particles. Your task is to write a `parameter_estimator` for the new model shown last below: a direct, closed-form estimate of its free parameters from data, using statistical principles rather than iterative fitting.

    **The estimator does not see the same data as the model. Read this before writing any indexing.**

    The *model* is called once per prediction, on a single window of one particle: `data['x']` has shape (20,), one-dimensional.

    The *estimator* is called once per particle, on that particle's entire training split:

        data['x'] : (n_blocks, block_len)     # two-dimensional

        axis 0 - block. Independent segments of the recording. Blocks are NOT contiguous
                 in time: never take a difference, lag or shift along axis 0.
        axis 1 - time. Consecutive steps within a block. `x[:, :-1]` and `x[:, 1:]`
                 are the (state, next state) pairs.

    Your estimate is the starting point for gradient descent on the loss. It must be finite and in the right regime; it does not have to be optimal. Index every axis explicitly.

    *Analyze* the progression of the parameter estimators below, *generalize* the improvements, and *create* a new parameter estimator that is better than *all* previous estimators.
  code_guidelines: |
    **Code Generation Guidelines:**

    * Import any packages you use. Do not include any text other than the code.
    * Function signature must be `def parameter_estimator(data):`, where `data['x']` has shape `(n_blocks, block_len)` as described above.
    * Return a dict whose keys exactly match the model's `params` keys, with every value a float. Mismatched keys or non-float values are rejected.
    * Do not fit with {swear_words}. We need a fast initial estimate, not an optimizer.
    * Do not call the model function — you will not have access to it.
    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument.
    * Ensure all string values in function call arguments are properly JSON-escaped.
    * Your response **must** be less than {max_lines} lines including imports, or it will be rejected.
