# Overrides for the autoregressive setting. String fields replace the default
# entirely (projects/prompt_defaults.yaml).
model:
  base: |
    You are an AI scientist studying the spontaneous dynamics of a population of recorded cells. The cells sit on a ring, and the data is ordered by position on the ring.

    Below are {num_parents} models predicting how the population's activity evolves in time, sorted from worst to best. Your task is to create a new model, better than all of them.

    **How the model is used, and how the loss is computed.** Let x(s) be the activity of all cells at time s. For every start time t:

        w1 = [x(t-1), x(t)]    p1 = model(w1)    # prediction of x(t+1)
        w2 = [x(t),   p1   ]   p2 = model(w2)    # prediction of x(t+2)
        w3 = [p1,     p2   ]   p3 = model(w3)    # prediction of x(t+3)

        loss = mean over all t, all h in 1..3, and all cells of ( ph - x(t+h) )^2

    After the first step the model runs on its own output, so errors compound. A model that is plausible one step ahead but has the dynamics wrong will drift over the three steps and be punished. Predicting that nothing changes is poor: the activity moves appreciably over three steps.

    *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.
  code_guidelines: |
    **Code Generation Guidelines:**

    * Import any packages you use.
    * Model signature must be `def model(data, params):`.
    * `data['x']` is the window, shape (n_cells, max_length). Column -1 is the most recent step, column -2 the one before. This is the only information you get: no stimulus, and no sight of the step you are predicting.
    * Return the predicted activity of every cell at the next step: shape (n_cells,).
    * `params` is a dict of named arrays/scalars (e.g. params['decay_rate']). All free parameters must be numeric.
    * Free parameters are penalized elementwise: an (n_cells, n_cells) matrix of couplings costs n_cells^2. Prefer structure over free parameters.
    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument.
    * Ensure all string values in function call arguments are properly JSON-escaped.
    * Also provide `default_params`: sensible initial float values for every key in `params`, with exactly matching keys.
  image_analysis_instructions: |
    **Image Analysis Instructions:**

    The attached figure has one row per model, above a row showing the data.

    *Left, heatmaps.* Cells (in ring order) by time, for one recording block. Red is positive activity, blue negative, white zero; all heatmaps share one colour scale, so they are directly comparable. The top panel is the data. Each panel below is that model's prediction of the same block three steps ahead, i.e. after three steps of running on its own output.

    *Right, line plots.* The top panel shows the true activity of three cells, marked by dotted lines in the data heatmap. Below, for each model, is that model's residual (prediction minus data) for those same three cells, in matching colours. Thin solid = residual one step ahead; thick dashed = three steps ahead. A perfect model leaves both flat at zero.

    Diagnose from the residuals, not the heatmaps: a mediocre and a good model have similar heatmaps but different residuals. Consider:

    **Growth with horizon.** How much larger is the three-step residual than the one-step residual? Large growth means the model is locally passable but its dynamics are wrong, and the error compounds. This matters most.

    **Structure.** Does the residual vary smoothly with time, or look like noise? Smooth variation is a systematic failure, and its shape is evidence about what the model is missing.

    **Which cells.** Is the residual large for some cells and small for others, and does that depend on where they sit on the ring?

    Use this to design a new model that removes the systematic errors you can see.
