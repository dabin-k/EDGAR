run:
  random_seed: 42

io:
  # data_path: "/home/dabin/data/wc_simulations/archive/wcs_fold0.npz"
  # data_path: "/home/dabin/code/ichun_opto/results"
  data_path: "/home/dabin/code/ichun_opto/edgar_b300_s1"   # only the 4 b300_*_s1.npz sessions (small GCP upload)

evolution:
  # Smoke defaults — override on the CLI for real runs (e.g. --evolution.n_generations=20).
  n_generations: 4
  n_islands: 3
  batch_size: 2
  critical_population_size: 8
  n_migrants: 1
  topology: [1, 2, 0]

llms:
  num_parents: 2
  # model_llm: claude-code-headless
  # param_est_llm: claude-code-headless
  # jax_model_translator_llm: claude-code-headless
  # model_llm: gemini-3.6-flash
  # param_est_llm: gemini-3.6-flash
  model_llm : gemini-3.6-flash 
  param_est_llm: gemini-3.6-flash 
  jax_model_translator_llm: gemini-3.1-flash-lite
  max_tokens: 10000

scoring:
  timeout_s: 600.0
  param_penalty_weight: 0.01
  gradient_descent:
    max_iter: 4000 
    learning_rate: 0.001
    gradient_clip_norm: 10.0 # pre-Adam global-norm clip; needed for long lax.scan backprop

project_params:
  random_seed: 42   # seeds the discover/validate split (mice for real data; samples for synthetic)
  T_eval: 200             # short window per cell for the fingerprint dedup
  n_eval: 4               # number of discover cells used for the fingerprint
  # Training-objective settings. load_data republishes these to env so apply_model / loss_fn
  # Override per run on the CLI, e.g. --project_params.objective=B.
  objective: "C"          # A one-step (teacher-forced) MSE | B anchored K-step rollout MSE | C full-trajectory rollout MSE

  # objective: "B"          # A one-step (teacher-forced) MSE | B anchored K-step rollout MSE | C full-trajectory rollout MSE
  # rollout_k: 3           # autonomous-rollout horizon, in bins (objective B)
  # anchor_stride: 1      # bins between rollout anchors (fewer = faster, coarser coverage)

  dt_seconds: 0.001       # SYNTHETIC-only bin->seconds convention (synthetic npz has no time axis).
  # Real opto data only (ignored for synthetic wc*_fold*.npz).
  chop_pre_ms: -150.0     # Phase 4 §0: keep bins with chop_pre_ms <= t*1000 < chop_post_ms
  chop_post_ms: 400.0
  # Loss not computed during warmup steps
  warmup_steps_ms: 100.0
  max_conditions: 52      # cap #conditions (n_stim) per split; M150823_ICTP2 has 38 vs 40 for the others. unset = all
  # Train/test split within each mouse-sample:
  #   k_fold   — trial CV over all conditions (train = other folds, test = held-out fold)
  #   exp_cond — fit on train_types conditions, test on held-out test_types conditions
  cv_type: "k_fold" # exp_cond | k_fold
  train_types: ["single_E", "single_I", "paired_EE", "paired_IE"]  # exp_cond only
  test_types: ["paired_II", "paired_EI"]                            # exp_cond only