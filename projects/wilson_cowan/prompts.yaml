# NOTE: written from scratch for WC — do NOT pattern-match to the state-space
# projects (fhn_excitable / oscillator_ss). Those differ from WC in every way
# that matters here:
#   * WC observes TWO populations (E, I), not one scalar; the prediction is a
#     tuple (E, I).
#   * `y_prev` is a DICT that also carries the external stimulus.
#   * The loss is MSE-based (one of several training objectives — one-step and/or
#     autonomous-rollout MSE)
#   * Both populations are FULLY OBSERVED, so a hidden variable is optional
#     (not required as it is for the excitable FHN task). If a model DOES carry a
#     hidden variable, its initial value is a learnable `s0_*` param (GD-fit per
#     sample) — E and I are observed, so they never get an `s0_*`.
# The contract below is defined by data_loader/load_data.py (the source of truth).

model:
  base: 'You are an AI scientist learning the dynamics of a **coupled neural
    circuit** with two interacting populations: an **excitatory** population E and
    an **inhibitory** population I. Your job is to discover a new model of the circuit
    that predicts the next activity of both populations given their previous activity. 
    
    At each step you are given the PREVIOUS observation (E[t-1], I[t-1]) together
    with the PREVIOUS stimulus, and you must predict the next observation
    (E[t], I[t]). The stimulus is a transient pulse that drives either E or I, and your 
    model should be able to describe the population activity under different experimental 
    conditions - single pulse, paired pulse, pulses with different duration, and so on. 
    
    Models are scored by a mean-squared error between predicted and observed E/I, averaged 
    over both stimulus conditions and over time. Lower is better.

    To do better your model must capture (a) how each population relaxes toward a
    baseline with its own time constant, (b) how the two populations DRIVE each
    other — E excites, I inhibits, (c) how the external stimulus feeds in, and 
    (d) how the population returns to baseline after the pulse. 

    Below are {num_parents} models, sorted from worst to best. *Analyze* their
    progression, *generalize* what lowers the loss, and *create* a new model that
    beats all of them. Take your time - think carefully about what type of dynamics
    might be missing in the earlier model and how to capture it.
    '
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use (use numpy as np).

    * Model signature must be `def model(state, y_prev, params):` — a SINGLE
    forward step of the circuit. `params` is a dict of learnable scalar floats.

    * `y_prev` is a DICT of scalars with EXACTLY these keys:
        - `y_prev["E_prev"]`   — excitatory activity at t-1
        - `y_prev["I_prev"]`   — inhibitory activity at t-1
        - `y_prev["stim_E_prev"]` — external drive to E at t-1 (1 during pulse, 0 otherwise) 
        - `y_prev["stim_I_prev"]` — external drive to I at t-1 (1 during pulse, 0 otherwise)

    * DO YOUR OWN INTEGRATION. You are predicting the next *value*, not a
    derivative. Compute a rate of change and take one Euler step with the fixed
    sampling interval, e.g.
        E_dot = (-E_prev + drive_E) / tau_E
        E = E_prev + E_dot
    and return `E` (and likewise `I`).

    * OUTPUT: return the tuple `(new_state, mean)` where `mean` is the tuple
    `(E, I)` — your prediction of the next excitatory and inhibitory activity. Do
    NOT return a scalar, a single array, or a distribution: return `(E, I)` as two
    scalars.

    * HIDDEN STATE IS OPTIONAL. Both E and I are observed, so you do NOT need a
    hidden variable. `state` is a dict; if you use none, return `new_state = {{}}`.
    If a slow process helps (e.g. a slowly accumulating adaptation that is NOT directly 
    observed), you MAY carry it: read it from `state`, and return `new_state` with the SAME keys.

    * Provide `model.DEFAULT_PARAMS`: a dict of sensible float initial values for
    EVERY key read from `params`. Values must be plain floats.

    * MANDATORY `s0_` RULE — EVERY new latent variable REQUIRES a matching `s0_`
    param. For EACH key `X` you read from `state` (i.e. every hidden variable your
    model introduces), you MUST add a matching `"s0_X"` float to
    `model.DEFAULT_PARAMS`. The name must match the state key EXACTLY:
    `state["S"]` ⇒ `"s0_S"`, `state["F_E"]` ⇒ `"s0_F_E"`.
    These are the learnable initial values of your hidden-state variables which will be optimised. 
    The model will fail with infinite loss if you do not provide a matching `s0_` param for every hidden variable.

    '
  image_analysis_instructions: '**Image Analysis Instructions:**

    The image has two parts. The TOP strip shows two randomly chosen example
    populations, each split into an E panel (left) and an I panel (right) showing that
    population''s activity over time. Use these only for a quick sense of the
    overall fit — because prediction is one-step-ahead and teacher-forced, a decent and
    a badly-wrong model both track the data closely here.

    The 2x2 grid BELOW plots the one-step prediction errors (residuals) : 
    r_E = observed_E - predicted_E against the previous value of E or I, and 
    similarly for r_I. Under teacher forcing these residuals are approximately
    the sum of the true terms your model left out, so any leftover structure points
    directly at a term you should add.

    HOW TO READ A PANEL. In each panel the leftover error (vertical) is a scatter
    against the previous value of one variable (horizontal). If the model has captured
    that variable''s contribution, the error does not depend on it: the cloud is a
    structureless band centred on zero. If a term in that variable is missing, the
    cloud TRENDS with the variable (points drift up or down as it increases). The
    number in each panel title is the correlation (between -1 and +1) between the error
    and that variable — a plain measure of how strong the leftover dependence is;
    ignore panels whose value is near zero. A caveat: E and I tend to rise and fall
    together, so a genuine dependence on one variable can leak a weaker trend into the
    panel for the other. Trust the STRONGER of the two panels in a row, and weigh the
    diagonal (self) against the off-diagonal (cross) rather than reading each panel in
    isolation.

    COLOUR = TIME. The scatter points are coloured by time within the stimulus
    transient (see the colorbar); baseline saturates to the ends. If the points at a
    given horizontal position form a colour-ordered LOOP — one colour branch above and
    a later-colour branch below — the error is not a static function of that variable
    but depends on the PHASE / history (rise vs fall). That points to a DYNAMIC missing
    term (a rate-of-change term or a slow hidden variable), not a plain function of the
    instantaneous value.

    Use this to create a new model that adds exactly the indicated term(s) and beats
    the parent models.

    '
parameter_estimator:
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use (use numpy as np).

    * Function signature must be `def parameter_estimator(data):`. `data` is ONE
    mouse''s training dict; the two stimulus conditions are stacked along axis 0:
        - `data["target_y"]`  — observed activity, `(n_stim, T, 2)`; the last axis is
          (E, I), so `E = data["target_y"][..., 0]` and `I = data["target_y"][..., 1]`,
          each `(n_stim, T)`.
        - `data["stim_E"]`, `data["stim_I"]`   — the stimulus, `(n_stim, T)`

    * Return a param dict whose keys EXACTLY match the model''s `DEFAULT_PARAMS`.
    Missing or extra keys will cause your estimator to be rejected. All values must
    be plain Python floats. This includes any `s0_`-prefixed keys (learnable initial
    values of hidden-state variables): return a sensible float (the model''s default is
    fine); gradient descent refines it.

    * Sensible, cheap estimates (no fitting — just statistics of the traces):

    * Your response **must** be less than {max_lines} lines including imports.

    * Do not use complex fitting functions like {swear_words}; a simple, fast
    initial estimate is all that is needed.

    * Do not call the model function; you will not have access to it.

    '
jax_translator_model:
  code_guidelines: 'CRITICAL JAX compatibility requirements :

    * The model signature is `def model(state, y_prev, params)` and returns
    `(new_state, mean)` where `mean` is the Python tuple `(E, I)` of two jnp
    scalars. Preserve this signature and the two-element return-tuple structure
    exactly. Do NOT collapse `(E, I)` into an array.

    * `y_prev` is a dict with keys `E_prev`, `I_prev`, `stim_E_prev`,
    `stim_I_prev`. stim_E_prev and stim_I_prev are 0 if no stimulus, 1 if stimulus present.
    Read from it exactly as the numpy model does.

    * `state` and `new_state` are dicts with the SAME keys throughout the scan
    (possibly empty). Do not add, remove, or rename keys.

    * Preserve `model.DEFAULT_PARAMS` verbatim, INCLUDING any `s0_`-prefixed keys
    (the learnable initial values of hidden-state variables — the framework strips
    the prefix to seed the scan carry). Preserve any module-level integration
    constant (e.g. `H = 1.0`) as a Python literal.

    * Replace all boolean indexing / Python `max`/`min` on array values with
    `jnp.maximum` / `jnp.minimum` / `jnp.where`. Use `jnp.clip` for clipping — not
    `jax.lax.clip`.

    * Use `jnp` everywhere (no `np`). Avoid Python control flow (if/for) that
    depends on array values.

    * No dynamic array shapes — all constants must be Python literals or
    compile-time integers.

    * Never call Python `int()` / `float()` on JAX values. Use `x.astype(float)`
    instead.

    * Ensure compatibility with `jax.jit`, `jax.grad`, `jax.vmap`, AND
    `jax.lax.scan` — the model is called inside a scan whose carry structure must
    be invariant.

    * Ensure all string values in function call arguments are properly
    JSON-escaped.

    '
