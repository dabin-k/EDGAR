
model:
  base: 'You are an AI scientist learning the dynamics of a **coupled neural
    circuit** with two interacting populations: an **excitatory** population E and
    an **inhibitory** population I. Your aim is to come up with an improved model that 
    accurately captures the dynamics of the circuit seen across different stimulus conditions.

    Optogenetic stimulation is used to deliver external pulses of varying lengths. The pulse can 
    target either the excitatory or inhibitory population, and in some cases two stimuli can 
    be delivered with varying inter-pulse intervals. The E pulse drives the excitatory population,
    and the I pulse drives the inhibitory population.
    
    The model is the right-hand side of an ODE: given the current excitatory and inhibitory activity
    (E, I), any hidden variables and the stimulus (stim_E, stim_I), it returns their time derivatives
    dE/dt, dI/dt (and those of the hidden variables). The framework integrates them over time using exponential Euler.
    Hidden variables would be necessary if the activities of E(t) and I(t) are not fully determined by their 
    current values and the stimulus. But increasing the number of hidden variables will create 
    a more powerful model, but the performance of the model will be penalised by the increased complexity of the 
    hidden state.

    The objective of the model is to predict the mean activity of the E and I populations.
    Models are scored by the MSE between the observed single-trial E and I activity and the
    model''s free-rollout predictions. The score is the average over mice. Lower is better.

    Below are {num_parents} models, sorted from worst to best. *Analyze* their
    progression, *generalize* what lowers the loss, and *create* a new model that
    beats all of them. Take your time - think carefully about what type of dynamics
    might be missing in the earlier model and how to capture it.
    '
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use (import numpy as np).

    * Model signature must be `def model(z, u, params):` — the RIGHT-HAND SIDE of
    the ODE dz/dt = f(z, u), evaluated at one instant. `params` is a dict of learnable scalar floats.

    * `z` is a DICT of scalars with the CURRENT VALUE of every variable:
        - `z["E"]`      — excitatory activity
        - `z["I"]`      — inhibitory activity
        - plus one key per hidden variable you add (e.g. `z["S"]`), see below.

    * `u` is a DICT of scalars with EXACTLY these keys:
        - `u["stim_E"]` — external drive to E (1 during pulse, 0 otherwise)
        - `u["stim_I"]` — external drive to I (1 during pulse, 0 otherwise)

    * OUTPUT: return ONE dict with EXACTLY the keys of `z`, each holding that variable''s TIME
    DERIVATIVE (per second), e.g. `{{"E": dE_dt, "I": dI_dt}}`. Do not return a tuple, an array, or a distribution.

    Write every equation in physical time: time constants are in SECONDS.

    * HIDDEN VARIABLES ARE OPTIONAL. If a slow process helps (e.g. a slowly accumulating
    adaptation / slow inhibition variable that is NOT directly observed), you MAY add one: it
    appears in `z` under its own name (e.g. `z["S"]`; never `E` or `I`) and you return its
    time derivative under the same key (e.g. `"S": (-S + I) / tau_S`). Declare it by giving its
    initial value as an `s0_`-prefixed entry in `model.DEFAULT_PARAMS` (e.g. `"s0_S": 1.0`):
    the framework adds `z["S"]`, starts it from that value, and refines the value by gradient
    descent. 
    * POSITIVE PARAMETERS ARE FITTED IN LOG SPACE. Decide for every parameter whether it
    must be positive (e.g. time constants, connection weights whose sign is already written
    into the equation, stimulus gains, saturation levels). Declare each positive parameter in
    `model.DEFAULT_PARAMS` with a `log_` prefix and its LOG value, e.g.
    `"log_tau_E": np.log(0.03)`. The framework fits the log value and passes
    `params["tau_E"] = exp(log_tau_E)` to your model, so the model code reads `params["tau_E"]`
    in natural units and never reads a `log_` key. A parameter that may change sign (e.g. a
    tonic drive) keeps a plain name. A positive hidden-state initial value is `log_s0_<name>`
    (e.g. `"log_s0_S": np.log(1.0)`).
    * Provide `model.DEFAULT_PARAMS`: a dict of sensible float initial values for
    EVERY parameter the model reads (the log value under the `log_` key for positive ones).
    Values must be plain floats.

    '
  image_analysis_instructions: '**Image Analysis Instructions:**

    The image shows the FREE ROLLOUT of the best-scoring parent model (named in the
    title, with its objective loss). Each row is one randomly drawn (sample, stimulus
    condition) pair; the row title gives the sample, the trial and its condition, and
    the legend gives that row''s rollout MSE. The LEFT panel is E and the RIGHT panel is I.
    In each panel the grey dots are the observed single trial, the black line is the
    mean of that sample''s trials of the same condition (for reference only; the model
    is fit to single trials), and the coloured line is the model''s free rollout (red
    for E, blue for I); red shading marks when the E pulse is on and blue shading
    marks when the I pulse is on. The x-axis is time from the first stimulus onset (ms). The first 100 ms of the
    window (up to -50 ms) is an unscored warm-up that lets any hidden state settle;
    the error after that is what counts.

    The rollout is seeded only with the first observation (and the `s0_` hidden
    state) and then feeds on its own predictions, so errors compound and a wrong model
    VISIBLY DIVERGES from the data: wrong peak amplitude, wrong rise or decay rate,
    drift away from baseline, a missing undershoot/rebound, a wrong response to the
    second pulse of a paired condition, spurious oscillations, or an outright blow-up.
    A good model tracks the data across the whole trajectory in every row.

    Compare where the mismatch appears (which population, during or after which pulse,
    in which condition) to decide which mechanism is missing or wrong, then create a new
    model that fixes it and beats the parent models.

    '
parameter_estimator:
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use (use numpy as np).

    * Function signature must be `def parameter_estimator(data):`. `data` is ONE
    mouse''s training dict; its individual trials are stacked along axis 0:
        - `data["target_y"]`  — observed activity, `(n_trials, T, 2)`; the last axis is
          (E, I), so `E = data["target_y"][..., 0]` and `I = data["target_y"][..., 1]`,
          each `(n_trials, T)`.
        - `data["stim_E"]`, `data["stim_I"]`   — the stimulus, `(n_trials, T)`
        - `data["time"]`      — the time axis, `(T,)`, in SECONDS; `dt = time[1] - time[0]`
          is the bin width. Return time constants in seconds (the model is an ODE in physical
          time).

    * Return a param dict whose keys EXACTLY match the model''s `DEFAULT_PARAMS`.
    Missing or extra keys will cause your estimator to be rejected. All values must
    be plain Python floats. This includes any `s0_`-prefixed keys (learnable initial
    values of hidden-state variables): return a sensible float (the model''s default is
    fine); gradient descent refines it.

    * For every `log_`-prefixed key return the LOG of a strictly positive estimate in natural
    units, e.g. `"log_tau_E": float(np.log(tau_E))`. Never return log(0) or log of a negative
    number: floor the estimate at a small positive value on the parameter''s natural scale.
    Gradient descent moves the log by only a few units, so an estimate that is many orders of
    magnitude too small effectively freezes the parameter.

    * Sensible, cheap estimates (no fitting — just statistics of the traces):

    * Your response **must** be less than {max_lines} lines including imports.

    * Do not use complex fitting functions like {swear_words}; a simple, fast
    initial estimate is all that is needed.

    * Do not call the model function; you will not have access to it.

    '
jax_translator_model:
  code_guidelines: 'CRITICAL JAX compatibility requirements :

    * The model signature is `def model(z, u, params)` and returns ONE dict of time
    derivatives with exactly the keys of `z` (jnp scalars). Preserve this signature and the
    return structure exactly; do not return a tuple or array, and do not add any time stepping.

    * `z` is a dict with keys `E`, `I` and any hidden variables; `u` is a dict with keys
    `stim_E`, `stim_I` (0 if no stimulus, 1 if stimulus present). Read from them exactly as
    the numpy model does. Do not add, remove, or rename keys.

    * The framework differentiates the model with respect to its inputs, so keep it smooth
    where the numpy model is smooth.

    * Preserve `model.DEFAULT_PARAMS` verbatim, INCLUDING any `s0_`-prefixed keys
    (the learnable initial values of hidden-state variables — the framework strips
    the prefix to seed the scan carry) and any `log_`-prefixed keys (positive parameters
    fitted in log space — the framework exponentiates them and passes the model the
    natural-unit value under the unprefixed name). Do not exponentiate inside the model.

    * Replace all boolean indexing / Python `max`/`min` on array values with
    `jnp.maximum` / `jnp.minimum` / `jnp.where`. Use `jnp.clip` for clipping — not
    `jax.lax.clip`.

    * Use `jnp` everywhere (no `np`). Avoid Python control flow (if/for) that
    depends on array values.

    * No dynamic array shapes — all constants must be Python literals or
    compile-time integers.

    * Never call Python `int()` / `float()` on JAX values. Use `x.astype(float)`
    instead.

    * Ensure compatibility with `jax.jit`, `jax.grad`, `jax.vmap`, AND
    `jax.lax.scan` — the model is called inside a scan whose carry structure must
    be invariant.

    * Ensure all string values in function call arguments are properly
    JSON-escaped.

    '
