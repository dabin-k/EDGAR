# Synthetic autoregressive benchmark. Data is generated by the loader from
# random_seed; data_path must stay empty so launch-gcp skips the data upload.
io:
  data_path: ""

evolution:
  n_generations: 12
  n_islands: 8
  batch_size: 6
  critical_population_size: 12
  n_migrants: 2
  topology: [1, 2, 3, 4, 5, 6, 7, 0]

scoring:
  # The default (0.01) is catastrophic for this project: parameters are counted
  # elementwise, and our losses run 1e-4 (correct model) to 4e-2 (do nothing), so a
  # 6-parameter model would pay 0.06 — more than the entire loss scale — and the
  # trivial persistence model would win. Calibrated in journal/2026-07-13_calibrate_penalty.py.
  param_penalty_weight: 1.0e-5

project_params:
  n_cells: 32
  n_times: 250
  n_recordings: 16
  dt: 0.1
  process_noise: 0.005
  obs_noise: 0.0
  block_len: 50
  random_seed: 0
  n_eval_samples: 4

evaluate:
  input_sequence_length: 2  # lags visible to the model
  rollout_steps: 3  # H: steps rolled on the model's own predictions
