# Burgers benchmark — EDGAR control (plan Step 5).
#
# Discover a discrete autoregressive map x(t) = f(x(t-1), ..., x(t-m)) for the
# UNFORCED (autonomous) coarse field. This is the temporal-lag CONTROL: no
# spatial-stencil structure is imposed, so it measures how well raw
# autoregressive fitting does before the Step-6 spatial hybrid reintroduces
# structure. See projects/burgers/README.md for the reference scoreboard.
#
# The field comes from a shared benchmark dataset written by
# data_loader/generate_datasets.py
io:
  data_path: /home/dabin/data/burgers_simulated/ic_seed_0_nl_0.0.npz

evolution:
  n_generations: 4
  n_islands: 5
  batch_size: 3
  critical_population_size: 12
  n_migrants: 2
  topology: [1, 2, 3, 4, 0]

scoring:
  # Loss scale on the ic_seed_0 datasets (2-step rollout MSE on discover-test):
  #   do-nothing (persistence)  4.8e-5 (nl 0.0) / 5.3e-5 (nl 0.01) / 5.1e-4 (nl 0.1)
  # The naive-one-step (~6.8e-6) and LS-floor (~2.7e-6) posts in the README are
  # from the OLD t<=160 field at 5-step rollout — re-measure before quoting them.
  # Parameters are counted elementwise. At 1e-7, a 5-parameter model costs 5e-7 —
  # enough to break ties between equally-accurate models, small enough to stay
  # well below the ~1e-5 loss gaps that separate good models from mediocre ones.
  # (Same reasoning as synthetic_data_v3, rescaled to this loss scale.)
  param_penalty_weight: 1.0e-9

project_params:
  block_len: 200      # time-block length; alternate blocks -> train/test per sample
                      # (1001 columns -> 5 blocks: train {0,2,4}, test {1,3})
  train_frac: 0.5     # kept for API symmetry (split is deterministic)
  n_eval_samples: 4   # blocks shown in image-feedback figure
  random_seed: 0

evaluate:
  input_sequence_length: 2  # lags visible to the model (window width); fed to evaluate + prompts
  rollout_steps: 2          # steps rolled on the model's own predictions before scoring
