# Overrides for the sensor-array autoregressive setting. String fields replace
# the default entirely (projects/prompt_defaults.yaml).
#
# Neutral framing by design: the data is presented only as displacement measured
# at a row of evenly-spaced sensors. No physical interpretation is given to the
# model.
model:
  base: |
    You are an AI scientist studying the motion of a population of particles. Based on data containing multiple recordings of the particles' displacement over different initial conditions, you want to find a 
    single parametric model that describes the data. Note, the data only contains the observed values - i.e. displacement over time where measurement is taken at some discrete coarse time intervals. 

    The model contains two elements : 
    * rhs function - we are looking for a PDE. The rhs function is the right-hand-side of the PDE du/dt = f(...). The rhs function takes the current state of the system (the displacements at all sensors) and computes the rate of change of the state.
    * integrator function - The integrator function takes the current state of the system and the output of the rhs function and computes the next state of the system. The integrator function is used to roll the model forward in time. The integrator function is called multiple times to roll the model

    The particles move along a line, and their displacement is measured at a row of evenly-spaced sensors. 
    The sensors wrap around, so the last sensor is a neighbour of the first, and the data is ordered by sensor position. 
    The measurement is a coarse, incomplete view of a finer underlying system. We want the model to capture the dynamics of the underlying system, not just the observed data.

    Below are {num_parents} models predicting how the measured displacements evolve in time, sorted from worst to best. 

    **How the model is used, and how the loss is computed.** Let x(s) be the displacement at all sensors at time s. For every start time t:

        w1 = [x(t-1), x(t)]    p1 = model(w1)    # prediction of x(t+1)
        w2 = [x(t),   p1   ]   p2 = model(w2)    # prediction of x(t+2)
        ...
        each step feeds the model its own previous prediction, for {rollout_steps} steps

        loss = mean over all t, all horizons h in 1..{rollout_steps}, and all sensors of ( ph - x(t+h) )^2

    After the first step the model runs on its own output, so errors compound. A model that is plausible one step ahead but has the dynamics wrong will drift over the rollout and be punished. 

    *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

  explore: |
    Which features in the models below correlate with lower loss? Interpret these features more broadly and creatively, and experiment with novel ways to implement these features.
    Be *creative* and try something novel!

  code_guidelines: |
    **Code Generation Guidelines:**

    * Import any packages you use.
    * Model signature must be `def model(data, params):`.
    * `data['x']` is the window, shape (n_sensors, max_length). Column -1 is the most recent step, column -2 the one before. This is the only information you get: no external input, and no sight of the step you are predicting.
    * Sensors wrap around (periodic). Reach a neighbour with `np.roll(u, 1)` (left) or `np.roll(u, -1)` (right). Work in sensor-index units — any physical spacing is absorbed into your free parameters.
    * `params` is a dict of named arrays/scalars (e.g. params['decay_rate']). All free parameters must be numeric.
    * Free parameters are penalized elementwise: an (n_sensors, n_sensors) matrix of couplings costs n_sensors^2.
    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument.
    * Ensure all string values in function call arguments are properly JSON-escaped.
    * Also provide `default_params`: sensible initial float values for every key in `params`, with exactly matching keys.

  image_analysis_instructions: |
    **Image Analysis Instructions:**

    The attached figure has one row per model, above a row showing the data.

    *Left, heatmaps.* Sensors (in position order) by time, for one block. Red is positive displacement, blue negative, white zero; all heatmaps share one colour scale, so they are directly comparable. The top panel is the data. Each panel below is that model's prediction of the same block {rollout_steps} steps ahead, i.e. after {rollout_steps} steps of running on its own output.

    *Right, line plots.* The top panel shows the true displacement of three sensors, marked by dotted lines in the data heatmap. Below, for each model, is that model's residual (prediction minus data) for those same three sensors, in matching colours. Thin solid = residual one step ahead; thick dashed = {rollout_steps} steps ahead. A perfect model leaves both flat at zero.

    Consider:

    **Growth with horizon.** How much larger is the {rollout_steps}-step residual than the one-step residual? Large growth means the model is locally passable but its dynamics are wrong, and the error compounds.

    **Structure.** Does the residual vary smoothly with time, or look like noise? Smooth variation is a systematic failure, and its shape is evidence about what the model is missing.

    **Which sensors.** Is the residual large for some sensors and small for others, and does that depend on where they sit in the row?

    Use this to design a new model that removes the systematic errors you can see.

parameter_estimator:
  base: |
    You are an AI scientist studying the motion of a population of particles. Your task is to write a `parameter_estimator` for the new model shown last below: a closed-form estimate of its free parameters from data based on statistical principles, 
    which we will use as a starting point for gradient descent to fit the parameters. It must be finite and in the right regime; it does not have to be the perfect one-step fit. Index every axis explicitly.

    **The estimator does not see the same data as the model. Read this before writing any indexing.**

    The *model* is called once per prediction step, on a short window: `data['x']` has shape `(n_sensors, max_length)`.

    The *estimator* is called once per recording, on that recording's entire training split:

        data['x'] : (n_blocks, n_sensors, block_len)     # three-dimensional

        axis 0 - block. Independent segments of the recording. Blocks are NOT contiguous
                 in time: never take a difference, lag or shift along axis 0.
        axis 1 - sensor. Position in the row; neighbouring indices are neighbouring sensors,
                 and the row wraps. `np.roll(x, 1, axis=1)` is the left-neighbour.
        axis 2 - time. Consecutive steps within a block. `x[:, :, :-1]` and `x[:, :, 1:]`
                 are the (state, next state) pairs.

    *Analyze* the progression of the parameter estimators below, *generalize* the improvements, and *create* a new parameter estimator that is better than *all* previous estimators.
  code_guidelines: |
    **Code Generation Guidelines:**

    * Import any packages you use. Do not include any text other than the code.
    * Function signature must be `def parameter_estimator(data):`, where `data['x']` has shape `(n_blocks, n_sensors, block_len)` as described above.
    * Return a dict whose keys exactly match the model's `params` keys, with every value a float. Mismatched keys or non-float values are rejected.
    * Do not fit with {swear_words}. We need a fast initial estimate, not an optimizer.
    * Do not call the model function — you will not have access to it.
    * Cast to `int()` when using a numeric value as an array size, slice index, or `range()` argument.
    * Ensure all string values in function call arguments are properly JSON-escaped.
    * Your response **must** be less than {max_lines} lines including imports, or it will be rejected.
